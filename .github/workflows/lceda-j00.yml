name: J00 LCEdA Compatibility Probe

# Manual by design. The default invocation records each runner and
# runs deterministic checks without fetching or launching a client.
on:
  workflow_dispatch:
    inputs:
      run_probe:
        description: Run the future j00_probe.py client probe where supported
        required: false
        type: boolean
        default: false
      download_client:
        description: Download and verify a pinned platform client archive
        required: false
        type: boolean
        default: false
      strict_download:
        description: Fail when a pinned client source is unavailable or missing
        required: false
        type: boolean
        default: false
      run_client_smoke:
        description: Install or open the uploaded official client and check CLI help or startup behavior
        required: false
        type: boolean
        default: false
      run_cli_probe:
        description: Run the Linux official CLI/API probe against a disposable offline project
        required: false
        type: boolean
        default: false
      linux_runner:
        description: Runner label for the Linux job (use a fixed self-hosted label after activating LCEDA there)
        required: false
        type: string
        default: ubuntu-24.04
      install_activation:
        description: Copy the LCEDA_PRO_ACTIVATION secret into the isolated Linux HOME for this run
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lceda-j00-${{ github.ref }}
  cancel-in-progress: true

jobs:
  j00:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
            probe_supported: true
          - platform: windows
            runner: windows-2025
            arch: x64
            probe_supported: false
          - platform: macos
            runner: macos-15-intel
            arch: x64
            probe_supported: false
      max-parallel: 1
    runs-on: ${{ matrix.platform == 'linux' && inputs.linux_runner || matrix.runner }}
    timeout-minutes: 30
    env:
      J00_PLATFORM: "${{ matrix.platform }}"
      J00_ARCH: "${{ matrix.arch }}"
      J00_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}"
      J00_RUN_DIR: "${{ github.workspace }}/.tmp/lceda-j00/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}"
      J00_DOWNLOAD_CLIENT: "${{ inputs.download_client }}"
      J00_STRICT_DOWNLOAD: "${{ inputs.strict_download }}"
      J00_START_XVFB: "false"
      PYTHONUTF8: "1"
    steps:
      - name: Check out public sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Resolve platform client metadata
        shell: python
        env:
          J00_MANIFEST_PATH: ${{ github.workspace }}/fixtures/lceda/j00/manifest.json
          LCEDA_CLIENT_BASE_URL: ${{ secrets.LCEDA_CLIENT_BASE_URL || secrets.J00_CLIENT_BASE_URL }}
        run: |
          import json
          import os
          from pathlib import Path

          document = json.loads(Path(os.environ["J00_MANIFEST_PATH"]).read_text(encoding="utf-8"))
          platform = os.environ["J00_PLATFORM"]
          arch = os.environ["J00_ARCH"]
          client = document.get("client") if isinstance(document.get("client"), dict) else {}
          records = []
          aliases = {platform, "mac" if platform == "macos" else platform}
          for candidate in client.get("candidates", []):
              if (isinstance(candidate, dict)
                      and str(candidate.get("platform", "")).lower() in aliases
                      and str(candidate.get("arch", "")).lower() == arch.lower()):
                  records.append(candidate)
          for container in (
              document.get("platforms"), document.get("clients"), document.get("artifacts"),
              client.get("platforms"), client.get("artifacts"), client.get(platform),
          ):
              if isinstance(container, dict):
                  item = container.get(platform) if platform in container else container
                  if isinstance(item, dict):
                      records.extend((item, item.get("download"), item.get("artifact")))
          url = ""
          digest = ""
          filename = ""
          size_bytes = ""
          for record in records:
              if not isinstance(record, dict):
                  continue
              if not filename:
                  filename = str(record.get("filename") or "")
              if not url:
                  url = next((str(record[key]) for key in ("download_url", "url", "source_url", "artifact_url") if record.get(key)), "")
              if not digest:
                  digest = next((str(record[key]) for key in ("sha256", "sha256sum", "installer_sha256", "digest") if record.get(key)), "")
              if not size_bytes and record.get("size_bytes") is not None:
                  size_bytes = str(record["size_bytes"])
          base_url = os.environ.get("LCEDA_CLIENT_BASE_URL", "").rstrip("/")
          if base_url and filename and digest:
              from urllib.parse import quote
              url = f"{base_url}/{quote(filename)}"
          source_url = str(client.get("source_url") or "")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"J00_CLIENT_URL={url}\n")
              handle.write(f"J00_CLIENT_SHA256={digest}\n")
              handle.write(f"J00_CLIENT_SIZE_BYTES={size_bytes}\n")
              handle.write(f"J00_CLIENT_SOURCE_URL={source_url}\n")
              handle.write(f"J00_DOWNLOAD_BLOCKED={str(not (url and len(digest) == 64)).lower()}\n")
          if not url or len(digest) != 64:
              print(f"J00: no pinned {platform} client URL and SHA-256; download is unverified/blocked")
          else:
              print(f"J00: resolved pinned {platform} client metadata")

      - name: Prepare isolated Linux runner environment
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          # j00_env.sh owns Linux-only Xvfb/process setup. The portable
          # download step below handles client archives for every platform.
          J00_DOWNLOAD_CLIENT=0 J00_START_XVFB="${{ (inputs.run_client_smoke || inputs.run_probe || inputs.run_cli_probe) && matrix.probe_supported }}" \
            bash scripts/lceda/j00_env.sh prepare
          test -s ".tmp/lceda-j00/${J00_RUN_ID}/env.sh"
          run_dir="${GITHUB_WORKSPACE}/.tmp/lceda-j00/${J00_RUN_ID}"
          # The generated file contains only this run's isolated paths and display settings.
          source "$run_dir/env.sh"
          {
            printf 'J00_RUN_DIR=%s\n' "$run_dir"
            printf 'J00_ARTIFACT_DIR=%s\n' "$run_dir/artifacts"
            printf 'J00_WORK_DIR=%s\n' "$run_dir/work"
            printf 'J00_RUNTIME_DIR=%s\n' "$run_dir/runtime"
            printf 'J00_HOME=%s\n' "$run_dir/home"
            printf 'J00_PROFILE_DIR=%s\n' "$run_dir/profile"
            printf 'J00_XDG_CONFIG_HOME=%s\n' "$run_dir/xdg-config"
            printf 'J00_XDG_CACHE_HOME=%s\n' "$run_dir/xdg-cache"
            printf 'J00_XDG_DATA_HOME=%s\n' "$run_dir/xdg-data"
            printf 'J00_ENV_FILE=%s\n' "$run_dir/env.sh"
            printf 'J00_PID_DIR=%s\n' "$run_dir/runtime/pids"
            printf 'J00_CLIENT_INSTALL_DIR=%s\n' "$run_dir/client"
            printf 'J00_CLIENT_ARCHIVE=%s\n' "$run_dir/runtime/client.download"
            printf 'DISPLAY=%s\nWAYLAND_DISPLAY=\nLIBGL_ALWAYS_SOFTWARE=1\n' "$DISPLAY"
          } >> "${GITHUB_ENV}"
          printf 'client_download_requested=%s\n' "${J00_DOWNLOAD_CLIENT}" \
            >> "${run_dir}/artifacts/environment.txt"

      - name: Prepare isolated Windows or macOS runner environment
        if: ${{ matrix.platform != 'linux' }}
        shell: python
        run: |
          import os
          import platform as platform_module
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          run_dir = repo / ".tmp" / "lceda-j00" / os.environ["J00_RUN_ID"]
          paths = {
              "J00_RUN_DIR": run_dir,
              "J00_ARTIFACT_DIR": run_dir / "artifacts",
              "J00_WORK_DIR": run_dir / "work",
              "J00_RUNTIME_DIR": run_dir / "runtime",
              "J00_HOME": run_dir / "home",
              "J00_PROFILE_DIR": run_dir / "profile",
              "J00_XDG_CONFIG_HOME": run_dir / "xdg-config",
              "J00_XDG_CACHE_HOME": run_dir / "xdg-cache",
              "J00_XDG_DATA_HOME": run_dir / "xdg-data",
              "J00_ENV_FILE": run_dir / "env.py.txt",
              "J00_PID_DIR": run_dir / "runtime" / "pids",
              "J00_CLIENT_INSTALL_DIR": run_dir / "client",
              "J00_CLIENT_ARCHIVE": run_dir / "runtime" / "client.download",
          }
          for key, path in paths.items():
              if key == "J00_ENV_FILE":
                  path.parent.mkdir(parents=True, exist_ok=True)
              else:
                  path.mkdir(parents=True, exist_ok=True)
          paths["J00_ENV_FILE"].write_text(
              "# Generated by lceda-j00 workflow\n" + "".join(f"{key}={path}\n" for key, path in paths.items()),
              encoding="utf-8",
          )
          (paths["J00_ARTIFACT_DIR"] / "environment.txt").write_text(
              f"platform={os.environ['J00_PLATFORM']}\nrunner={platform_module.platform()}\n"
              f"client_download_enabled={os.environ['J00_DOWNLOAD_CLIENT']}\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8", newline="\n") as handle:
              for key, path in paths.items():
                  handle.write(f"{key}={path}\n")

      - name: Install temporary LCEDA activation file
        if: ${{ inputs.install_activation && matrix.platform == 'linux' }}
        shell: bash
        env:
          LCEDA_PRO_ACTIVATION: ${{ secrets.LCEDA_PRO_ACTIVATION || secrets.J00_LCEDA_ACTIVATION }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${LCEDA_PRO_ACTIVATION:-}" ]]; then
            echo 'LCEDA_PRO_ACTIVATION secret is empty; add it before enabling install_activation' >&2
            exit 1
          fi
          activation_dir="${J00_HOME}/LCEDA-Pro"
          activation_file="${activation_dir}/lceda-pro-activation.txt"
          mkdir -p "${activation_dir}"
          printf '%s' "${LCEDA_PRO_ACTIVATION}" > "${activation_file}"
          chmod 0600 "${activation_file}"
          test -s "${activation_file}"
          printf 'activation_file_installed=true\n' >> "${J00_ARTIFACT_DIR}/environment.txt"

      - name: Download and verify pinned platform client
        # The J00 real-client target is Linux x64. Other matrix entries keep
        # deterministic contract/process checks until their archives are
        # explicitly published and pinned.
        if: ${{ inputs.download_client && matrix.platform == 'linux' }}
        shell: python
        env:
          LCEDA_CLIENT_UPLOAD_TOKEN: ${{ secrets.LCEDA_CLIENT_UPLOAD_TOKEN || secrets.J00_CLIENT_UPLOAD_TOKEN }}
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import urllib.error
          import urllib.parse
          import urllib.request
          import time

          artifact_dir = Path(os.environ["J00_ARTIFACT_DIR"])
          url = os.environ.get("J00_CLIENT_URL", "")
          expected = os.environ.get("J00_CLIENT_SHA256", "")
          expected_size = os.environ.get("J00_CLIENT_SIZE_BYTES", "")
          upload_token = os.environ.get("LCEDA_CLIENT_UPLOAD_TOKEN", "")
          source_url = os.environ.get("J00_CLIENT_SOURCE_URL", "")
          strict = os.environ.get("J00_STRICT_DOWNLOAD", "").lower() == "true"
          archive_base = Path(os.environ["J00_CLIENT_ARCHIVE"])
          install_dir = Path(os.environ["J00_CLIENT_INSTALL_DIR"])

          def record(status, reason):
              with (artifact_dir / "environment.txt").open("a", encoding="utf-8") as handle:
                  handle.write(f"client_download_status={status}\nclient_download_reason={reason}\n")
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8", newline="\n") as handle:
                  handle.write(f"J00_DOWNLOAD_STATUS={status}\n")

          if not url or not re.fullmatch(r"[0-9A-Fa-f]{64}", expected):
              reason = "missing pinned platform URL or SHA-256"
              if source_url.startswith("https://"):
                  try:
                      with urllib.request.urlopen(source_url, timeout=30) as response:
                          reason = f"official source reachable ({response.status}) but no pinned platform archive is published"
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, OSError) as error:
                      reason = f"official source unavailable or requires login: {error}"
              record("blocked", reason)
              if strict:
                  raise SystemExit(reason)
              raise SystemExit(0)
          if not url.startswith("https://"):
              reason = "client URL must use HTTPS"
              record("blocked", reason)
              if strict:
                  raise SystemExit(reason)
              raise SystemExit(0)

          filename = urllib.parse.unquote(urllib.parse.urlsplit(url).path.rsplit("/", 1)[-1])
          if not filename or Path(filename).name != filename:
              raise SystemExit("client URL has no safe archive filename")
          archive = archive_base.with_name(filename)

          # Expose the exact downloaded file to later smoke steps. Keep the
          # transfer token scoped to this download step only.
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"J00_CLIENT_ARCHIVE={archive}\n")

          part = archive.with_name(archive.name + ".part")
          try:
              source_host = (urllib.parse.urlsplit(url).hostname or "").lower()
              public_github_host = (
                  source_host == "github.com"
                  or source_host.endswith(".github.com")
                  or source_host.endswith(".githubusercontent.com")
              )
              # Release assets are public and redirect to a signed object URL;
              # never send the private upload token to either host.
              headers = (
                  {"Authorization": f"Bearer {upload_token}"}
                  if upload_token and not public_github_host else {}
              )
              expected_bytes = int(expected_size) if expected_size else 0
              chunk_bytes = 8 * 1024 * 1024
              use_ranges = expected_bytes and source_host.endswith("trycloudflare.com")
              with part.open("wb") as output:
                  if use_ranges:
                      offset = 0
                      while offset < expected_bytes:
                          end = min(offset + chunk_bytes, expected_bytes) - 1
                          expected_chunk = end - offset + 1
                          for attempt in range(4):
                              try:
                                  range_headers = {
                                      **headers,
                                      "Accept-Encoding": "identity",
                                      "Range": f"bytes={offset}-{end}",
                                  }
                                  request = urllib.request.Request(url, headers=range_headers)
                                  with urllib.request.urlopen(request, timeout=120) as response:
                                      status = int(getattr(response, "status", response.getcode()))
                                      content_range = response.headers.get("Content-Range", "")
                                      if status == 200 and offset == 0 and not content_range:
                                          # Preserve compatibility with sources that ignore Range.
                                          shutil.copyfileobj(response, output, length=1024 * 1024)
                                          offset = expected_bytes
                                          break
                                      if status != 206 or not content_range.startswith(f"bytes {offset}-"):
                                          raise OSError("client source does not honor byte ranges")
                                      data = bytearray()
                                      while len(data) < expected_chunk:
                                          block = response.read(min(1024 * 1024, expected_chunk - len(data)))
                                          if not block:
                                              raise OSError("client source returned a truncated byte range")
                                          data.extend(block)
                                      output.write(data)
                                      offset = end + 1
                                      break
                              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, OSError):
                                  if attempt == 3:
                                      raise
                                  time.sleep(2 ** attempt)
                  else:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=120) as response:
                          shutil.copyfileobj(response, output, length=1024 * 1024)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, OSError) as error:
              reason = f"client source unavailable: {error}"
              record("blocked", reason)
              if strict:
                  raise SystemExit(str(error))
              raise SystemExit(0)
          if not part.is_file() or part.stat().st_size == 0:
              reason = "official source returned an empty archive"
              record("blocked", reason)
              if strict:
                  raise SystemExit(reason)
              raise SystemExit(0)
          digest = hashlib.sha256()
          with part.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual.lower() != expected.lower():
              reason = "downloaded archive SHA-256 does not match the pinned digest"
              record("failed", reason)
              raise SystemExit(reason)
          if expected_size and part.stat().st_size != int(expected_size):
              reason = "downloaded archive size does not match the pinned size"
              record("failed", reason)
              raise SystemExit(reason)
          part.replace(archive)
          install_dir.mkdir(parents=True, exist_ok=True)
          suffix = urllib.parse.urlsplit(url).path.lower()
          if suffix.endswith((".zip", ".tar.gz", ".tgz", ".tar.xz", ".tar.bz2")):
              import sys
              sys.path.insert(0, str(Path("scripts/lceda").resolve()))
              from j00_runner import extract_archive
              extract_archive(archive, install_dir)
          else:
              shutil.copy2(archive, install_dir / filename)
          record("verified", expected.lower())

      - name: Run isolated LCEDA Pro client smoke
        if: ${{ inputs.download_client && inputs.run_client_smoke && matrix.platform == 'linux' }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          env = os.environ.copy()
          env["J00_RUN_DIR"] = os.environ["J00_RUN_DIR"]
          result = subprocess.run(
              [sys.executable, "scripts/lceda/j00_client_smoke.py"],
              check=False, env=env, timeout=360,
          )
          if result.returncode:
              raise SystemExit(result.returncode)

      - name: Configure Linux Electron sandbox helper
        if: ${{ inputs.download_client && (inputs.run_client_smoke || inputs.run_cli_probe) && matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sandbox="${J00_CLIENT_INSTALL_DIR}/lceda-pro/chrome-sandbox"
          crashpad="${J00_CLIENT_INSTALL_DIR}/lceda-pro/chrome_crashpad_handler"
          test -f "$sandbox"
          test -f "$crashpad"
          # The client starts a packaged owner process for CLI sessions. That
          # child does not inherit --no-sandbox, so configure Electron's helper
          # before launching it from the user-owned extraction directory.
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          chmod 0755 "$crashpad"
          stat -c '%U %G %a %n' "$sandbox"
          stat -c '%U %G %a %n' "$crashpad"

      - name: Run official CLI and offline project round-trip probe
        if: ${{ inputs.download_client && inputs.run_cli_probe && matrix.platform == 'linux' }}
        shell: python
        run: |
          import os
          import subprocess
          import sys

          env = os.environ.copy()
          result = subprocess.run(
              [sys.executable, "scripts/lceda/j00_cli_probe.py"],
              check=False, env=env, timeout=1500,
          )
          if result.returncode:
              raise SystemExit(result.returncode)

      - name: Validate probe reference without running it
        if: ${{ !inputs.run_probe }}
        shell: python
        run: |
          from pathlib import Path
          import py_compile

          probe = Path("scripts/lceda/j00_probe.py")
          if probe.is_file():
              py_compile.compile(str(probe), doraise=True)
          else:
              print("j00_probe.py is not present; probe execution remains disabled.")

      - name: Run J00 Python contract tests
        shell: python
        env:
          # The contract suite validates missing metadata. Keep client transfer
          # details confined to the explicit download and smoke steps.
          J00_CLIENT_URL: ""
          J00_CLIENT_SHA256: ""
        run: |
          import compileall
          from pathlib import Path
          import subprocess
          import sys

          for root in (Path("scripts/lceda"), Path("tests/lceda/j00")):
              if not compileall.compile_dir(str(root), quiet=1):
                  raise SystemExit(f"Python compilation failed under {root}")
          subprocess.run(
              [sys.executable, "-m", "unittest", "discover", "-s", "tests/lceda/j00", "-p", "test_*.py"],
              check=True,
          )

      - name: Run Windows/macOS process and file smoke
        if: ${{ matrix.platform != 'linux' }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          smoke_dir = Path(os.environ["J00_RUN_DIR"]) / "smoke"
          smoke_dir.mkdir(parents=True, exist_ok=True)
          marker = smoke_dir / "process-file.txt"
          subprocess.run(
              [sys.executable, "-c", "from pathlib import Path; Path(__import__('sys').argv[1]).write_text('ok\\n')", str(marker)],
              check=True,
          )
          if marker.read_text(encoding="utf-8") != "ok\n":
              raise SystemExit("process/file smoke marker mismatch")
          print(f"process/file smoke passed on {os.environ['J00_PLATFORM']}")

      - name: Record unsupported probe platform
        if: ${{ inputs.run_probe && !matrix.probe_supported }}
        shell: python
        run: |
          from pathlib import Path
          import os

          artifact = Path(os.environ["J00_ARTIFACT_DIR"])
          (artifact / "probe-platform.txt").write_text(
              f"run_probe requested; platform {os.environ['J00_PLATFORM']} has no supported J00 client probe\n",
              encoding="utf-8",
          )
          print("J00 probe skipped: this platform runs contract and process/file smoke only.")

      - name: Run J00 probe on supported platform
        if: ${{ inputs.run_probe && matrix.probe_supported }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/lceda/j00_probe.py
          python3 scripts/lceda/j00_probe.py

      - name: Capture Linux LCEDA client logs
        if: ${{ always() && matrix.platform == 'linux' }}
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          home = Path(os.environ["J00_HOME"])
          artifact = Path(os.environ["J00_ARTIFACT_DIR"]) / "client-logs-workflow"
          artifact.mkdir(parents=True, exist_ok=True)
          roots = sorted(path for path in home.glob("**/LCEDA-Pro/logs") if path.is_dir())
          (Path(os.environ["J00_ARTIFACT_DIR"]) / "client-log-roots-workflow.txt").write_text(
              "\n".join(str(path) for path in roots) + "\n", encoding="utf-8"
          )
          for index, root in enumerate(roots):
              for source in root.rglob("*.log"):
                  destination = artifact / str(index) / source.relative_to(root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)

      - name: Clean up Linux J00 processes and transient state
        if: ${{ always() && matrix.platform == 'linux' }}
        shell: bash
        run: |
          set +e
          bash scripts/lceda/j00_env.sh cleanup

      - name: Clean up Windows or macOS transient state
        if: ${{ always() && matrix.platform != 'linux' }}
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          run_dir = Path(os.environ["J00_RUN_DIR"])
          for name in ("work", "profile", "home", "xdg-config", "xdg-cache", "xdg-data", "runtime", "client"):
              shutil.rmtree(run_dir / name, ignore_errors=True)

      - name: Redact J00 evidence for upload
        if: ${{ always() && matrix.platform == 'linux' }}
        shell: bash
        run: |
          set +e
          bash scripts/lceda/j00_env.sh sanitize

      - name: Redact Windows or macOS evidence for upload
        if: ${{ always() && matrix.platform != 'linux' }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          import shutil

          run_dir = Path(os.environ["J00_RUN_DIR"])
          source_root = run_dir / "artifacts"
          redacted = run_dir / "redacted-artifacts"
          redacted.mkdir(parents=True, exist_ok=True)
          workspace = str(Path(os.environ["GITHUB_WORKSPACE"]).resolve())
          home = str(Path.home())
          if source_root.is_dir():
              for source in source_root.rglob("*"):
                  if not source.is_file():
                      continue
                  destination = redacted / source.relative_to(source_root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  try:
                      text = source.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      shutil.copy2(source, destination)
                  else:
                      text = text.replace(workspace, "<redacted-path>").replace(home, "<redacted-home>")
                      text = re.sub(r"(?i)(token|password|secret|authorization)(\\s*[:=]\\s*)[^,\\s}]+", r"\\1\\2<redacted>", text)
                      destination.write_text(text, encoding="utf-8")

      - name: Upload redacted J00 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: lceda-j00-${{ matrix.platform }}-${{ github.run_id }}
          path: .tmp/lceda-j00/**/redacted-artifacts/
          if-no-files-found: ignore
          retention-days: 7
