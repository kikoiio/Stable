name: Go

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Build CLI and workers
        run: go build ./cmd/...
      - name: Run unit tests
        run: go test ./...

  # 安装后验收（install / cli / e2e / restart）。四个脚本占用固定端口
  # 17387-17389，必须串行，放在同一 job 内由 make 顺序执行。
  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build release package and run package acceptance
        run: make test-package
