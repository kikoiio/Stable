name: Go

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-e2e-deps
        with:
          kicad: 'false'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Test remote browser UI behavior
        run: node --test tests/remote-ui.test.cjs
      - name: Build CLI and workers
        run: go build ./cmd/...
      - name: Run unit tests
        run: go test ./...

  # 安装后验收（install / lifecycle / cli / e2e / restart）。固定端口场景
  # 17387-17389，必须串行，放在同一 job 内由 make 顺序执行。
  test-package:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-e2e-deps
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build release package and run package acceptance
        run: make test-package
      - name: Resolve verified package paths
        id: package-files
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "archive=dist/stable-${version}-linux-amd64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/stable-${version}-linux-amd64.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload verified Linux package
        uses: actions/upload-artifact@v4
        with:
          name: stable-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package-files.outputs.archive }}
            ${{ steps.package-files.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
